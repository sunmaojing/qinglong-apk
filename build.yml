name: Build APK for v2.10.13 Compatibility

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout FuShengPing repo
        uses: actions/checkout@v4
        with:
          repository: FuShengPing/android-qinglong
          ref: v2.1.6
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Apply v2.10.13 compatibility patches
        run: |
          cd app/src/main/java/auto/panel/net/panel/v15
          
          # Patch 1: Api.java - Remove pagination params
          sed -i 's/@Query("page") int page, @Query("size") int size/@Query("searchValue") String searchValue/' Api.java
          sed -i 's/getTasks(@Query("searchValue") String searchValue, @Query("page") int page, @Query("size") int size)/getTasks(@Query("searchValue") String searchValue)/' Api.java
          sed -i 's/@Query("searchValue") String searchValue/@Query("search") String searchValue/' Api.java
          
          # Patch 2: ApiController.java - Fix response handling
          sed -i 's/return res.send({ code: 200, data });/return res.send({ code: 200, data: { list: data, total: data.length } });/' ApiController.java
          
          echo "Patches applied successfully"
          
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
          
      - name: Build APK with Gradle
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-apk-v2.10-compat
          path: app/build/outputs/apk/release/app-release.apk
          
      - name: List APK file
        run: |
          ls -la app/build/outputs/apk/release/
          echo "APK size:"
          du -h app/build/outputs/apk/release/app-release.apk
